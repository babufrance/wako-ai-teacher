<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wako Live Teacher</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #wako-video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

<video
  id="wako-video"
  autoplay
  muted
  loop
  playsinline
  preload="auto">
  
  <source
    src="https://raw.githubusercontent.com/babufrance/wako-ai-teacher/main/WAKO_LIVE_TEACHER_10MIN_GITHUB.mp4"
    type="video/mp4">
</video>

<script>
  const video = document.getElementById("wako-video");

  video.muted = true;
  video.playsInline = true;

  const startWako = () => {
    video.play().catch(() => {});
  };

  if (video.readyState >= 2) {
    startWako();
  } else {
    video.addEventListener("canplay", startWako, { once: true });
  }

  document.addEventListener("touchstart", startWako, { once: true });
  document.addEventListener("click", startWako, { once: true });
</script>

</body>
</html>
