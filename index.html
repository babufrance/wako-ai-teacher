<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wako AI Teacher</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

video {
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>


<body>


<video id="wako"
autoplay
playsinline>
</video>



<script>


const videos = [

    // Attente
    "videos/idle.mp4",

    // Idle vers écoute
    "videos/raccord_idle_listen.mp4",

    // Écoute élève
    "videos/listen.mp4",

    // Écoute vers réflexion
    "videos/raccord_listen_think.mp4",

    // Réflexion
    "videos/think.mp4",

    // Réflexion vers réponse
    "videos/raccord_think_speak.mp4",

    // Réponse Wako (lipsync conservé)
    "videos/speak_1.mp4",
    "videos/speak_2.mp4",

    // Fin réponse retour attente
    "videos/raccord_speak_idle.mp4",

    // Encouragement
    "videos/encourage_1.mp4",

    // Passage au revoir
    "videos/raccord_encourage_goodbye.mp4",

    // Goodbye
    "videos/goodbye.mp4",

    // Retour idle
    "videos/raccord_goodbye_idle.mp4"

];



let index = 0;

const player = document.getElementById("wako");



function playNext(){

    player.src = videos[index];

    player.load();

    player.play()
    .catch(function(){});


    index++;


    if(index >= videos.length){

        index = 0;

    }

}



player.addEventListener(
"ended",
playNext
);



playNext();


</script>


</body>

</html>
