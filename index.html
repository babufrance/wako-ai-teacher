<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wako AI Teacher</title>

<style>

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}


.avatar-box {

    width:420px;
    height:650px;
    border-radius:25px;
    overflow:hidden;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);

}


video {

    width:100%;
    height:100%;
    object-fit:cover;

}


</style>

</head>


<body>


<div class="avatar-box">

<video id="wako"
playsinline
autoplay>
</video>

</div>



<script>


const sequence = [

"videos/idle.mp4",

"videos/raccord_idle_listen.mp4",

"videos/listen.mp4",

"videos/raccord_listen_think.mp4",

"videos/think.mp4",

"videos/raccord_think_speak.mp4",

"videos/speak_1.mp4",

"videos/speak_2.mp4",

"videos/raccord_speak_idle.mp4",

"videos/idle.mp4"


];


let current = 0;

const video = document.getElementById("wako");



function playNext(){

    video.src = sequence[current];

    video.currentTime = 0;

    video.play();

    current++;

    if(current >= sequence.length){

        current = 0;

    }

}



video.addEventListener(
"ended",
playNext
);



playNext();



</script>


</body>

</html>
